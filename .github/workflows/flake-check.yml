# Built with Claude
#
# Save as: .github/workflows/flake-check.yml in rpdav/nixos
#
# Fast feedback on every push: just `nix flake check`, no host builds. Skips the
# auto/flake-update branch deliberately - that branch already gets a full check+build
# via ci.yml once flake-update.yml opens its PR, so running this too would be redundant.
# Keep this branch name in sync with UPDATE_BRANCH in flake-update.yml if you rename it.
#
# Required repo secrets: same NIX_SECRETS_DEPLOY_KEY / NIX_SECRETS_PAT / TS_OAUTH_CLIENT_ID /
# TS_AUDIENCE / ATTIC_TOKEN as the other workflows.

name: Flake check

on:
  push:
    branches-ignore:
      - auto/flake-update

permissions:
  contents: read

concurrency:
  # New pushes to the same branch cancel whatever's still running for it.
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: extra-experimental-features = pipe-operators

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.NIX_SECRETS_PAT }}
          extra_nix_config: |
            trusted-users = root runner

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Configure attic cache
        run: |
          nix run nixpkgs#attic-client -- login ci https://nix.dfrp.xyz "${{ secrets.ATTIC_TOKEN }}"
          nix run nixpkgs#attic-client -- use nixos-cache

      - name: flake check
        run: |
          nix run nixpkgs#attic-client -- watch-store nixos-cache &
          echo "watcher_pid=$!" >> "$GITHUB_ENV"
          nix flake check --keep-going --print-build-logs

      - name: Stop cache watcher
        if: always()
        run: kill -INT "$watcher_pid" 2>/dev/null && wait "$watcher_pid" 2>/dev/null || true
