# Built with Claude
#
# Weekly flake.lock and uptix.lock version bump and PR.
#
# Required repo secrets:
#   NIX_SECRETS_DEPLOY_KEY          - read-only SSH deploy key for rpdav/nix-secrets
#   CI_PAT                          - lets actions bot automatically run CI actions on pull request
#   TS_OAUTH_CLIENT_ID, TS_AUDIENCE - Tailscale OIDC/workload-identity federation
#   ATTIC_TOKEN                     - push/pull token for the `ci` attic client identity
#

name: Weekly flake update

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: flake-update
  cancel-in-progress: false

env:
  UPDATE_BRANCH: auto/flake-update
  # need pipe operators for this repo
  NIX_CONFIG: extra-experimental-features = pipe-operators

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # lets the Tailscale action request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v5

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          # Rate-limit mitigation only
          github_access_token: ${{ secrets.CI_PAT }}
          extra_nix_config: |
            trusted-users = root runner

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Configure attic cache
        run: |
          nix run nixpkgs#attic-client -- login ci https://nix.dfrp.xyz "${{ secrets.ATTIC_TOKEN }}"
          nix run nixpkgs#attic-client -- use nixos-cache

      - name: Update flake inputs
        shell: bash # explicit shell => pipefail, so a failed update isn't hidden by tee
        run: nix flake update 2>&1 | tee update.log

      - name: Update uptix.lock
        run: nix run github:luizribeiro/uptix -- update

      # The only derivation built here is the uptix binary. This will push
      # it to the attic cache for later CI builds.
      - name: Push uptix to cache
        run: |
          nix run nixpkgs#attic-client -- push nixos-cache \
            "$(nix path-info github:luizribeiro/uptix)"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock uptix.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Automated weekly update."
            echo
            # Keep only the "• Added/Updated/Removed input ..." summary blocks -
            # i.e. each bullet line plus its indented continuation line(s) - and
            # drop everything else `nix flake update` prints (progress, warnings).
            awk '
              /^•/ { p=1; print; next }
              p && /^[[:space:]]/ { print; next }
              { p=0 }
            ' update.log
          } > pr-body.md

      - name: Open PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.UPDATE_BRANCH }}
          token: ${{ secrets.CI_PAT }}
          delete-branch: true
          add-paths: |
            flake.lock
            uptix.lock
          commit-message: "chore: weekly flake + uptix update"
          title: "chore: weekly flake + uptix update"
          body-path: pr-body.md

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
