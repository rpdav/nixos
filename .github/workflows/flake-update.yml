# Built with Claude
# Save as: .github/workflows/flake-update.yml in rpdav/nixos
#
# Proposes the weekly update: bumps flake.lock + uptix.lock, commits, pushes a branch,
# opens a PR. Does NOT run `nix flake check` or build any hosts - that's ci.yml's job,
# triggered automatically as a check on the PR this workflow opens (and on any later
# pushes to it, including your own local debugging commits).
#
# Required repo secrets:
#   NIX_SECRETS_DEPLOY_KEY  - read-only SSH deploy key for rpdav/nix-secrets
#   NIX_SECRETS_PAT         - kept only to reduce GitHub API rate limiting on public
#                              github: inputs (nixpkgs, uptix); no longer grants secrets access
#   TS_OAUTH_CLIENT_ID, TS_AUDIENCE - Tailscale OIDC/workload-identity federation
#   ATTIC_TOKEN             - push/pull token for the `ci` attic client identity
# Required repo setting: Settings -> Actions -> General -> Workflow permissions ->
#                        "Allow GitHub Actions to create and approve pull requests"

name: Weekly flake update

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: flake-update
  cancel-in-progress: false

env:
  UPDATE_BRANCH: auto/flake-update
  # Your config uses `|>`, which is gated behind an experimental feature. Nix reads NIX_CONFIG in
  # every job/step; the `extra-` prefix appends to (rather than replaces) the features the
  # install action already enables. Requires Nix >= 2.24.
  NIX_CONFIG: extra-experimental-features = pipe-operators

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # lets the Tailscale action request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v5

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          # Rate-limit mitigation only - nix-secrets access now comes from the ssh-agent
          # step above (flake input is git+ssh://git@github.com/rpdav/nix-secrets).
          github_access_token: ${{ secrets.NIX_SECRETS_PAT }}
          extra_nix_config: |
            trusted-users = root runner

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Configure attic cache
        run: |
          nix run nixpkgs#attic-client -- login ci https://nix.dfrp.xyz "${{ secrets.ATTIC_TOKEN }}"
          nix run nixpkgs#attic-client -- use nixos-cache

      - name: Update flake inputs
        shell: bash # explicit shell => pipefail, so a failed update isn't hidden by tee
        run: nix flake update 2>&1 | tee update.log

      - name: Update uptix.lock
        run: nix run github:luizribeiro/uptix -- update

      - name: Push uptix to cache
        # Single small derivation from `nix run` above - a direct push is simpler than
        # standing up a watch-store watcher for one already-realized path.
        run: |
          nix run nixpkgs#attic-client -- push nixos-cache \
            "$(nix path-info github:luizribeiro/uptix)"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock uptix.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Automated weekly update."
            echo
            echo '```'
            cat update.log
            echo '```'
          } > pr-body.md

      - uses: peter-evans/create-pull-request@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          branch: ${{ env.UPDATE_BRANCH }}
          delete-branch: true
          add-paths: |
            flake.lock
            uptix.lock
          commit-message: "chore: weekly flake + uptix update"
          title: "chore: weekly flake + uptix update"
          body-path: pr-body.md
